<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Daftar Prospek — Legacy Makers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2422;
    --ink-soft:#4a5450;
    --paper:#eef0ea;
    --card:#ffffff;
    --line:#dcdfd6;
    --hot:#c14b3a;
    --hot-bg:#fbe8e4;
    --warm:#c8862b;
    --warm-bg:#faedd9;
    --cold:#3a6ea5;
    --cold-bg:#e2ecf5;
    --neutral:#9aa39c;
    --neutral-bg:#eef0ea;
  }
  *{box-sizing:border-box;}
  html,body{overflow-x:hidden;}
  html{scroll-padding-bottom:140px;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Sans',sans-serif;
    -webkit-tap-highlight-color:transparent;
    padding-bottom:110px;
  }
  header{
    padding:22px 18px 0;
    background:var(--ink);
    color:var(--paper);
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 14px rgba(0,0,0,.12);
  }
  .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:#a9b3ab;
    margin-bottom:4px;
    font-weight:600;
  }
  h1{
    font-family:'Fraunces',serif;
    font-weight:600;
    font-size:26px;
    margin:0 0 14px;
    letter-spacing:-.01em;
  }

  .tabs{
    display:flex;
    gap:4px;
    background:rgba(255,255,255,.07);
    border-radius:11px;
    padding:4px;
    margin-bottom:14px;
  }
  .tab{
    flex:1;
    text-align:center;
    padding:9px 4px;
    border-radius:8px;
    font-size:13px;
    font-weight:600;
    color:#aab4ad;
    cursor:pointer;
    transition:all .15s;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
  }

  .stats{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }
  .stat{
    flex:1;
    background:rgba(255,255,255,.06);
    border-radius:10px;
    padding:8px 10px;
    text-align:center;
    cursor:pointer;
    border:1.5px solid transparent;
    transition:border-color .15s;
  }
  .stat.active{border-color:currentColor;}
  .stat .n{font-family:'Fraunces',serif;font-size:20px;font-weight:600;display:block;line-height:1.1;}
  .stat .l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;}
  .stat.all{color:#eef0ea;}
  .stat.hot{color:#e8968a;}
  .stat.warm{color:#e3bd7f;}
  .stat.cold{color:#9dc0e3;}
  .searchwrap{
    position:relative;
    padding-bottom:14px;
  }
  .searchwrap input{
    width:100%;
    padding:10px 14px 10px 34px;
    border-radius:10px;
    border:none;
    background:rgba(255,255,255,.1);
    color:#fff;
    font-size:14px;
    font-family:inherit;
  }
  .searchwrap input::placeholder{color:#9aa8a1;}
  .searchwrap svg{position:absolute;left:11px;top:11px;opacity:.6;}
  header.compact .tabs,
  header.compact .stats,
  header.compact .searchwrap{
    display:none;
  }
  header.compact{
    padding-bottom:14px;
  }
  header.compact h1{margin-bottom:0;}

  main{padding:16px;max-width:640px;margin:0 auto;}
  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty .big{font-family:'Fraunces',serif;font-size:19px;color:var(--ink);margin-bottom:6px;}

  .card{
    background:var(--card);
    border-radius:14px;
    margin-bottom:12px;
    box-shadow:0 1px 3px rgba(28,36,34,.08);
    border-left:5px solid var(--neutral);
    overflow:hidden;
    transition:border-color .2s;
  }
  .card.hot{border-left-color:var(--hot);}
  .card.warm{border-left-color:var(--warm);}
  .card.cold{border-left-color:var(--cold);}

  .card-top{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:14px 14px 10px;
    cursor:pointer;
  }
  .no-badge{
    font-family:'Fraunces',serif;
    font-size:13px;
    color:var(--ink-soft);
    min-width:22px;
    padding-top:2px;
  }
  .card-main{flex:1;min-width:0;}
  .nama-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .nama{
    font-family:'Fraunces',serif;
    font-size:17px;
    font-weight:600;
    line-height:1.25;
  }
  .nama:empty:before{content:'Nama belum diisi';color:#b7bdb5;font-weight:400;font-style:italic;}
  .type-tag{
    font-size:10px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    padding:2px 7px;
    border-radius:20px;
    background:var(--neutral-bg);
    color:var(--ink-soft);
    flex-shrink:0;
  }
  .type-tag.team{background:#e7e2f5;color:#6a4fb0;}
  .sub{
    font-size:12.5px;
    color:var(--ink-soft);
    margin-top:2px;
    display:flex;
    gap:6px;
    flex-wrap:wrap;
  }
  .sub span:not(:last-child):after{content:'·';margin-left:6px;color:#c7ccc3;}
  .mini-check{
    font-size:11px;
    font-weight:600;
    color:#5c8a63;
  }

  .chev{
    color:var(--ink-soft);
    transition:transform .2s;
    flex-shrink:0;
    margin-top:4px;
  }
  .card.open .chev{transform:rotate(180deg);}

  .card-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .25s ease;
  }
  .card.open .card-body{max-height:1400px;}
  .fields{
    padding:2px 14px 16px;
    display:grid;
    gap:12px;
  }
  .field label{
    display:block;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.08em;
    color:var(--ink-soft);
    font-weight:600;
    margin-bottom:4px;
  }
  .field .hint{
    font-size:10.5px;
    color:#a3aba4;
    text-transform:none;
    letter-spacing:0;
    font-weight:400;
    margin-left:4px;
  }
  .field input, .field textarea{
    width:100%;
    min-width:0;
    max-width:100%;
    border:1.5px solid var(--line);
    border-radius:9px;
    padding:9px 11px;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    background:#fbfbf9;
  }
  .field input:focus, .field textarea:focus{
    outline:none;
    border-color:var(--ink);
    background:#fff;
  }
  .field textarea{resize:vertical;min-height:52px;}

  .seg-group{display:flex;gap:8px;}
  .seg-btn{
    flex:1;
    padding:9px 0;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fbfbf9;
    font-family:'IBM Plex Sans',sans-serif;
    font-weight:600;
    font-size:13px;
    color:var(--ink-soft);
    cursor:pointer;
    transition:all .15s;
  }
  .seg-btn.hot.sel{background:var(--hot-bg);border-color:var(--hot);color:var(--hot);}
  .seg-btn.warm.sel{background:var(--warm-bg);border-color:var(--warm);color:var(--warm);}
  .seg-btn.cold.sel{background:var(--cold-bg);border-color:var(--cold);color:var(--cold);}
  .seg-btn.type.sel{background:var(--ink);border-color:var(--ink);color:var(--paper);}

  .checklist-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:9px;
    background:#fbfbf9;
    transition:all .15s;
  }
  .checklist-row.checked{
    background:#eef6ee;
    border-color:#7fae86;
  }
  .check-label{
    display:flex;
    align-items:center;
    gap:10px;
    flex:1;
    min-width:0;
    cursor:pointer;
  }
  .checklist-row .box{
    width:19px;height:19px;
    border-radius:6px;
    border:1.7px solid var(--line);
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:#fff;
  }
  .checklist-row.checked .box{
    background:#4d8a55;
    border-color:#4d8a55;
  }
  .checklist-row .box svg{display:none;}
  .checklist-row.checked .box svg{display:block;}
  .checklist-row .txt{font-size:14px;font-weight:500;color:var(--ink);}
  .checklist-row.checked .txt{color:#3d6b43;}
  .checklist-row .mini-date{
    flex-shrink:0;
    width:118px;
    max-width:38%;
    min-width:0;
    padding:7px 6px;
    font-size:12px;
    border:1.5px solid var(--line);
    border-radius:7px;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }

  .card-actions{
    display:flex;
    justify-content:flex-end;
    padding-top:2px;
  }
  .del-btn{
    background:none;
    border:none;
    color:#b8756a;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
    padding:6px 8px;
  }

  .fab{
    position:fixed;
    bottom:22px;
    right:18px;
    left:18px;
    max-width:604px;
    margin:0 auto;
    background:var(--ink);
    color:var(--paper);
    border:none;
    border-radius:14px;
    padding:15px 0;
    font-family:'Fraunces',serif;
    font-size:16px;
    font-weight:600;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    cursor:pointer;
    box-shadow:0 6px 18px rgba(28,36,34,.28);
    transition:transform .2s ease, opacity .2s ease;
    z-index:30;
  }
  .fab:active{transform:scale(.98);}
  .fab.hide{
    transform:translateY(140px);
    opacity:0;
    pointer-events:none;
  }

  .toast{
    position:fixed;
    top:14px;
    left:50%;
    transform:translateX(-50%) translateY(-40px);
    background:var(--ink);
    color:var(--paper);
    padding:9px 16px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:600;
    opacity:0;
    transition:all .25s;
    z-index:100;
    pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  ::-webkit-scrollbar{width:0;}

  .screen{display:none;}
  .screen.active{display:block;}
  .simple-header{
    padding:22px 18px 20px;
    background:var(--ink);
    color:var(--paper);
    position:sticky;
    top:0;
  }
  .back-row{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:#aab4ad;
    cursor:pointer;
    margin-bottom:10px;
  }
  .pick-main{padding:16px;max-width:640px;margin:0 auto;}
  .pick-tile{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--card);
    border-radius:14px;
    padding:16px;
    margin-bottom:10px;
    box-shadow:0 1px 3px rgba(28,36,34,.08);
    cursor:pointer;
  }
  .pick-tile:active{transform:scale(.99);}
  .pick-tile .name{font-family:'Fraunces',serif;font-size:16px;font-weight:600;}
  .pick-tile .count{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .pick-tile svg{color:var(--ink-soft);flex-shrink:0;}
  .add-row{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .add-row input{
    flex:1;
    min-width:0;
    padding:11px 13px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
  }
  .add-row button{
    padding:0 18px;
    border-radius:10px;
    border:none;
    background:var(--ink);
    color:var(--paper);
    font-weight:600;
    font-family:'Fraunces',serif;
    font-size:14px;
    cursor:pointer;
    flex-shrink:0;
  }
  .context-strip{
    display:flex;
    align-items:center;
    gap:5px;
    font-size:12.5px;
    font-weight:600;
    color:#aab4ad;
    cursor:pointer;
    margin-bottom:10px;
  }
  .context-strip b{color:#eef0ea;font-weight:600;}
  header.compact .context-strip{display:none;}
</style>
</head>
<body>

<div class="screen active" id="leaderScreen">
  <div class="simple-header">
    <div class="eyebrow">Legacy Makers</div>
    <h1>Pilih Leader</h1>
  </div>
  <div class="pick-main">
    <div id="leaderList"></div>
    <div class="add-row">
      <input id="newLeaderInput" type="text" placeholder="Nama leader baru" onkeydown="if(event.key==='Enter') addLeader()">
      <button onclick="addLeader()">+ Tambah</button>
    </div>
  </div>
</div>

<div class="screen" id="partnerScreen">
  <div class="simple-header">
    <div class="back-row" onclick="backToLeaders()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 6l-6 6 6 6"/></svg>
      Ganti Leader
    </div>
    <div class="eyebrow" id="partnerLeaderName">Leader</div>
    <h1>Pilih Partner</h1>
  </div>
  <div class="pick-main">
    <div id="partnerList"></div>
    <div class="add-row">
      <input id="newPartnerInput" type="text" placeholder="Nama partner baru" onkeydown="if(event.key==='Enter') addPartner()">
      <button onclick="addPartner()">+ Tambah</button>
    </div>
  </div>
</div>

<div class="screen" id="listScreen">
<header>
  <div class="context-strip" onclick="backToPartners()">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M15 6l-6 6 6 6"/></svg>
    <b id="ctxLabel"></b>
  </div>
  <div class="eyebrow">Legacy Makers</div>
  <h1>Daftar Prospek</h1>
  <div class="tabs">
    <div class="tab active" data-tab="client">Client</div>
    <div class="tab" data-tab="team">Team</div>
    <div class="tab" data-tab="semua">Semua</div>
  </div>
  <div class="stats">
    <div class="stat all active" data-filter="all"><span class="n" id="cnt-all">0</span><span class="l">Semua</span></div>
    <div class="stat hot" data-filter="hot"><span class="n" id="cnt-hot">0</span><span class="l">Hot</span></div>
    <div class="stat warm" data-filter="warm"><span class="n" id="cnt-warm">0</span><span class="l">Warm</span></div>
    <div class="stat cold" data-filter="cold"><span class="n" id="cnt-cold">0</span><span class="l">Cold</span></div>
  </div>
  <div class="searchwrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.3"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Cari nama, pekerjaan, atau domisili…">
  </div>
</header>

<main id="list"></main>

<button class="fab" id="addBtn">+ Tambah Calon</button>
</div>

<div class="toast" id="toast"></div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyqa3KHQm3kwZ9In325bLryTr5uw-geirUqROHgJS8zeHKdO6ZNSNIzZsrRaS2Jt7xcTA/exec';
  const STORAGE_KEY_PREFIX = 'prospects-list';
const ORG_KEY = 'org-structure';
let data = [];
let activeTab = 'client';
let hwcFilter = 'all';
let openId = null;
let orgData = { leaders: [] };
let currentLeaderId = null;
let currentPartnerId = null;

function uid(){ return 'p' + Date.now() + Math.random().toString(36).slice(2,7); }

function storageKey(){
  return `${STORAGE_KEY_PREFIX}:${currentLeaderId}:${currentPartnerId}`;
}

function seedOrgIfEmpty(){
  if(orgData.leaders.length===0){
    const partnerNames = ['David & Puput','Audrey','Vannes','Hans','Calvina','Evan','Aldi'];
    ['Rikko'].forEach(leaderName=>{
      orgData.leaders.push({
        id: 'leader-' + uid(),
        name: leaderName,
        partners: partnerNames.map(n => ({id:'ptn-'+uid(), name:n}))
      });
    });
  }
}

async function loadOrg(){
  try{
    const res = await window.storage.get(ORG_KEY);
    orgData = res ? JSON.parse(res.value) : { leaders: [] };
  }catch(e){
    orgData = { leaders: [] };
  }
  if(!orgData.leaders) orgData.leaders = [];
  seedOrgIfEmpty();
  await saveOrg();
  renderLeaderScreen();
}

async function saveOrg(){
  try{
    await window.storage.set(ORG_KEY, JSON.stringify(orgData));
  }catch(e){
    showToast('Gagal menyimpan, coba lagi');
  }
}

function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(name+'Screen').classList.add('active');
}

function renderLeaderScreen(){
  showScreen('leader');
  const wrap = document.getElementById('leaderList');
  if(orgData.leaders.length===0){
    wrap.innerHTML = `<div class="empty"><div class="big">Belum ada leader</div>Tambah dulu di bawah.</div>`;
    return;
  }
  wrap.innerHTML = orgData.leaders.map(l => `
    <div class="pick-tile" onclick="selectLeader('${l.id}')">
      <div>
        <div class="name">${escapeHtml(l.name)}</div>
        <div class="count">${l.partners.length} partner</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  `).join('');
}

function selectLeader(id){
  currentLeaderId = id;
  renderPartnerScreen();
}

function renderPartnerScreen(){
  showScreen('partner');
  const leader = orgData.leaders.find(l=>l.id===currentLeaderId);
  document.getElementById('partnerLeaderName').textContent = leader ? leader.name : '';
  const wrap = document.getElementById('partnerList');
  if(!leader || leader.partners.length===0){
    wrap.innerHTML = `<div class="empty"><div class="big">Belum ada partner</div>Tambah dulu di bawah.</div>`;
    return;
  }
  wrap.innerHTML = leader.partners.map(p => `
    <div class="pick-tile" onclick="selectPartner('${p.id}')">
      <div class="name">${escapeHtml(p.name)}</div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  `).join('');
}

async function selectPartner(id){
  currentPartnerId = id;
  const leader = orgData.leaders.find(l=>l.id===currentLeaderId);
  const partner = leader ? leader.partners.find(p=>p.id===id) : null;
  document.getElementById('ctxLabel').textContent = (leader?leader.name:'') + ' · ' + (partner?partner.name:'');
  showScreen('list');
  await load();
}

function backToLeaders(){
  currentLeaderId = null;
  currentPartnerId = null;
  renderLeaderScreen();
}

function backToPartners(){
  currentPartnerId = null;
  renderPartnerScreen();
}

async function addLeader(){
  const input = document.getElementById('newLeaderInput');
  const name = input.value.trim();
  if(!name) return;
  orgData.leaders.push({id:'leader-'+uid(), name, partners:[]});
  input.value = '';
  await saveOrg();
  renderLeaderScreen();
}

async function addPartner(){
  const input = document.getElementById('newPartnerInput');
  const name = input.value.trim();
  if(!name) return;
  const leader = orgData.leaders.find(l=>l.id===currentLeaderId);
  if(!leader) return;
  leader.partners.push({id:'ptn-'+uid(), name});
  input.value = '';
  await saveOrg();
  renderPartnerScreen();
}


async function load(){
  try{
    const url = `${GOOGLE_SCRIPT_URL}?action=get&leaderId=${encodeURIComponent(currentLeaderId)}&partnerId=${encodeURIComponent(currentPartnerId)}`;
    const res = await fetch(url);
    const result = await res.json();
    if(!result.ok) throw new Error(result.error || 'Gagal mengambil data');
    data = Array.isArray(result.data) ? result.data : [];
  }catch(e){
    console.warn('Google Sheet load gagal:', e);
    // Fallback ke data lokal bila koneksi Google Sheet gagal.
    try{
      const res = await window.storage.get(storageKey());
      data = res ? JSON.parse(res.value) : [];
    }catch(e2){
      data = [];
    }
  }
  data.forEach(p=>{
    if(!p.tipe) p.tipe = 'client';
    if(p.ceritaKonsep===undefined) p.ceritaKonsep = false;
    if(p.ceritaKonsepDate===undefined) p.ceritaKonsepDate = p.p1date || '';
    if(p.ceritaIlustrasi===undefined) p.ceritaIlustrasi = false;
    if(p.ceritaIlustrasiDate===undefined) p.ceritaIlustrasiDate = p.p2date || '';
    if(p.kuesioner===undefined) p.kuesioner = false;
    if(p.simpleBtl===undefined) p.simpleBtl = false;
    if(p.ajakSabtu===undefined) p.ajakSabtu = false;
  });
  render();
}

async function save(){
  try{
    const leader = orgData.leaders.find(l=>l.id===currentLeaderId);
    const partner = leader ? leader.partners.find(p=>p.id===currentPartnerId) : null;

    const body = new URLSearchParams();
    body.append('leaderId', currentLeaderId || '');
    body.append('leader', leader ? leader.name : '');
    body.append('partnerId', currentPartnerId || '');
    body.append('partner', partner ? partner.name : '');
    body.append('data', JSON.stringify(data));

    const res = await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      body
    });

    const result = await res.json();
    if(!result.ok) throw new Error(result.error || 'Gagal menyimpan');

    // Backup lokal juga disimpan.
    try{
      await window.storage.set(storageKey(), JSON.stringify(data));
    }catch(e2){}

  }catch(e){
    console.warn('Google Sheet save gagal:', e);
    // Tetap simpan lokal bila internet/Apps Script bermasalah.
    try{
      await window.storage.set(storageKey(), JSON.stringify(data));
      showToast('Tersimpan lokal — Sheet gagal');
    }catch(e2){
      showToast('Gagal menyimpan');
    }
  }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function addProspect(){
  const tipe = activeTab === 'team' ? 'team' : 'client';
  const p = { id: uid(), tipe, nama:'', pekerjaan:'', hwc:'', domisili:'', notes:'',
    ceritaKonsep:false, ceritaKonsepDate:'', ceritaIlustrasi:false, ceritaIlustrasiDate:'',
    kuesioner:false, simpleBtl:false, ajakSabtu:false };
  data.unshift(p);
  openId = p.id;
  render();
  save();
  setTimeout(()=>{
    const el = document.querySelector(`[data-namafield="${p.id}"]`);
    if(el) el.focus();
    el?.scrollIntoView({behavior:'smooth', block:'start'});
  }, 60);
}

function updateField(id, key, value){
  const p = data.find(x=>x.id===id);
  if(!p) return;
  p[key] = value;
  save();
}

function updateFieldAndRefresh(id, key, value){
  updateField(id, key, value);
  renderList();
}

function toggleCheck(id, key){
  const p = data.find(x=>x.id===id);
  if(!p) return;
  p[key] = !p[key];
  save();
  renderList();
}

function removeProspect(id){
  data = data.filter(x=>x.id!==id);
  save();
  render();
  showToast('Dihapus');
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getTabData(){
  if(activeTab==='client') return data.filter(p=>p.tipe==='client');
  if(activeTab==='team') return data.filter(p=>p.tipe==='team');
  return data;
}

function render(){
  updateCounts();
  renderList();
}

function updateCounts(){
  const tabData = getTabData();
  document.getElementById('cnt-all').textContent = tabData.length;
  document.getElementById('cnt-hot').textContent = tabData.filter(p=>p.hwc==='hot').length;
  document.getElementById('cnt-warm').textContent = tabData.filter(p=>p.hwc==='warm').length;
  document.getElementById('cnt-cold').textContent = tabData.filter(p=>p.hwc==='cold').length;
}

function renderList(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  let items = getTabData();
  if(hwcFilter!=='all') items = items.filter(p=>p.hwc===hwcFilter);
  if(q) items = items.filter(p =>
    (p.nama||'').toLowerCase().includes(q) ||
    (p.pekerjaan||'').toLowerCase().includes(q) ||
    (p.domisili||'').toLowerCase().includes(q)
  );

  const list = document.getElementById('list');
  if(items.length===0){
    list.innerHTML = `<div class="empty"><div class="big">Belum ada calon di sini</div>Ketuk "Tambah Calon" buat mulai catat.</div>`;
    return;
  }

  list.innerHTML = items.map((p, idx) => {
    const no = idx + 1;
    const isOpen = openId === p.id;
    const subParts = [p.pekerjaan, p.domisili].filter(Boolean);
    const checkTags = [];
    if(p.tipe==='team'){
      if(p.kuesioner) checkTags.push('Kuesioner ✓');
      if(p.simpleBtl) checkTags.push('BTL ✓');
      if(p.ajakSabtu) checkTags.push('Sabtu ✓');
    } else {
      if(p.ceritaKonsep) checkTags.push('Konsep ✓');
      if(p.ceritaIlustrasi) checkTags.push('Ilustrasi ✓');
    }
    return `
    <div class="card ${p.hwc||''} ${isOpen?'open':''}" data-card="${p.id}">
      <div class="card-top" onclick="toggleCard('${p.id}')">
        <div class="no-badge">${no}.</div>
        <div class="card-main">
          <div class="nama-row">
            <div class="nama">${escapeHtml(p.nama)}</div>
            ${activeTab==='semua' ? `<span class="type-tag ${p.tipe}">${p.tipe==='team'?'Team':'Client'}</span>` : ''}
          </div>
          ${subParts.length ? `<div class="sub">${subParts.map(s=>`<span>${escapeHtml(s)}</span>`).join('')}</div>` : ''}
          ${checkTags.length ? `<div class="sub"><span class="mini-check">${checkTags.join(' · ')}</span></div>` : ''}
        </div>
        <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>
      </div>
      <div class="card-body">
        <div class="fields">
          <div class="field">
            <label>Tipe</label>
            <div class="seg-group">
              <button class="seg-btn type ${p.tipe==='client'?'sel':''}" onclick="updateField('${p.id}','tipe','client'); renderList();">Client</button>
              <button class="seg-btn type ${p.tipe==='team'?'sel':''}" onclick="updateField('${p.id}','tipe','team'); renderList();">Team</button>
            </div>
          </div>
          <div class="field">
            <label>Nama</label>
            <input data-namafield="${p.id}" type="text" value="${escapeHtml(p.nama)}" placeholder="Nama calon" oninput="updateField('${p.id}','nama',this.value)" onblur="renderList()">
          </div>
          <div class="field">
            <label>Pekerjaan / Usaha</label>
            <input type="text" value="${escapeHtml(p.pekerjaan)}" placeholder="cth. Karyawan swasta, punya usaha katering" oninput="updateField('${p.id}','pekerjaan',this.value)" onblur="renderList()">
          </div>
          <div class="field">
            <label>H / W / C</label>
            <div class="seg-group">
              <button class="seg-btn hot ${p.hwc==='hot'?'sel':''}" onclick="setHwc('${p.id}','hot')">Hot</button>
              <button class="seg-btn warm ${p.hwc==='warm'?'sel':''}" onclick="setHwc('${p.id}','warm')">Warm</button>
              <button class="seg-btn cold ${p.hwc==='cold'?'sel':''}" onclick="setHwc('${p.id}','cold')">Cold</button>
            </div>
          </div>
          <div class="field">
            <label>Domisili</label>
            <input type="text" value="${escapeHtml(p.domisili)}" placeholder="Kota / area tempat tinggal" oninput="updateField('${p.id}','domisili',this.value)" onblur="renderList()">
          </div>
          <div class="field">
            <label>Notes</label>
            <textarea placeholder="Catatan bebas — kebutuhan, keberatan, follow-up..." oninput="updateField('${p.id}','notes',this.value)">${escapeHtml(p.notes)}</textarea>
          </div>
          ${p.tipe === 'team' ? `
          <div class="field">
            <div class="checklist-row ${p.kuesioner?'checked':''}">
              <div class="check-label" onclick="toggleCheck('${p.id}','kuesioner')">
                <div class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="txt">Sudah kuesioner</div>
              </div>
            </div>
          </div>
          <div class="field">
            <div class="checklist-row ${p.simpleBtl?'checked':''}">
              <div class="check-label" onclick="toggleCheck('${p.id}','simpleBtl')">
                <div class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="txt">Simple BTL</div>
              </div>
            </div>
          </div>
          <div class="field">
            <div class="checklist-row ${p.ajakSabtu?'checked':''}">
              <div class="check-label" onclick="toggleCheck('${p.id}','ajakSabtu')">
                <div class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="txt">Sudah diajak ke Sabtu</div>
              </div>
            </div>
          </div>` : `
          <div class="field">
            <div class="checklist-row ${p.ceritaKonsep?'checked':''}">
              <div class="check-label" onclick="toggleCheck('${p.id}','ceritaKonsep')">
                <div class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="txt">Sudah cerita konsep</div>
              </div>
              <input type="date" class="mini-date" value="${escapeHtml(p.ceritaKonsepDate)}" onclick="event.stopPropagation()" oninput="updateField('${p.id}','ceritaKonsepDate',this.value)">
            </div>
          </div>
          <div class="field">
            <div class="checklist-row ${p.ceritaIlustrasi?'checked':''}">
              <div class="check-label" onclick="toggleCheck('${p.id}','ceritaIlustrasi')">
                <div class="box"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg></div>
                <div class="txt">Sudah cerita ilustrasi</div>
              </div>
              <input type="date" class="mini-date" value="${escapeHtml(p.ceritaIlustrasiDate)}" onclick="event.stopPropagation()" oninput="updateField('${p.id}','ceritaIlustrasiDate',this.value)">
            </div>
          </div>`}
          <div class="card-actions">
            <button class="del-btn" onclick="event.stopPropagation(); if(confirm('Hapus ${escapeHtml(p.nama)||'calon ini'}?')) removeProspect('${p.id}')">Hapus</button>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleCard(id){
  openId = openId === id ? null : id;
  renderList();
}

function setHwc(id, val){
  const p = data.find(x=>x.id===id);
  if(p.hwc === val) p.hwc = '';
  else p.hwc = val;
  save();
  renderList();
}

document.getElementById('addBtn').addEventListener('click', addProspect);
document.getElementById('search').addEventListener('input', renderList);
document.querySelectorAll('.stat').forEach(el=>{
  el.addEventListener('click', ()=>{
    hwcFilter = el.dataset.filter;
    document.querySelectorAll('.stat').forEach(s=>s.classList.remove('active'));
    el.classList.add('active');
    renderList();
  });
});
document.querySelectorAll('.tab').forEach(el=>{
  el.addEventListener('click', ()=>{
    activeTab = el.dataset.tab;
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    el.classList.add('active');
    render();
  });
});

// Hide the floating add button whenever a text field is focused so the
// on-screen keyboard never covers it (and the keyboard itself never
// gets blocked by a fixed button sitting on top of it).
let hideTimer = null;
document.addEventListener('focusin', (e)=>{
  if(e.target.matches('input, textarea')){
    clearTimeout(hideTimer);
    document.getElementById('addBtn').classList.add('hide');
    document.querySelector('header').classList.add('compact');
  }
});
document.addEventListener('focusout', (e)=>{
  if(e.target.matches('input, textarea')){
    clearTimeout(hideTimer);
    hideTimer = setTimeout(()=>{
      const active = document.activeElement;
      if(!active || !active.matches('input, textarea')){
        document.getElementById('addBtn').classList.remove('hide');
        document.querySelector('header').classList.remove('compact');
      }
    }, 120);
  }
});

// React to the keyboard using the real viewport size the browser reports,
// instead of guessing with a fixed delay.
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', ()=>{
    const kb = window.innerHeight - window.visualViewport.height;
    const keyboardOpen = kb > 60;
    document.body.style.paddingBottom = keyboardOpen ? (kb + 40) + 'px' : '110px';
    const active = document.activeElement;
    if(keyboardOpen && active && active.matches('input, textarea')){
      active.scrollIntoView({behavior:'smooth', block:'start'});
    }
  });
}

loadOrg();
</script>
